name: kata-containers
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: fuse3
    from: /rootfs/
    to: /rootfs/
  - stage: glibc
    from: /rootfs/
    to: /rootfs/usr/local/lib/containers/nydus-for-kata-tee/
  - image: ghcr.io/noeljackson/kata-deploy-codewire@sha256:88bfde4167ec9528d8c37684e9ca6368a781075c3cbf8c8e423047fb213d0539
    from: /opt/nydus-snapshotter/bin
  - image: docker.io/library/golang:1.26.7-alpine3.23@sha256:b17af760035fc2f338eed92d448a6c67f2d45438844fc6c60678fa5f99e44b57
    from: /usr/local/go/
    to: /toolchain/go/
steps:
  - sources:
    # {{ if eq .ARCH "aarch64" }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
      - url: https://github.com/kata-containers/kata-containers/releases/download/{{ .KATA_CONTAINERS_VERSION }}/kata-static-{{ .KATA_CONTAINERS_VERSION }}-arm64.tar.zst
        destination: kata-static.tar.zst
        sha256: {{ .KATA_CONTAINERS_STATIC_ARM64_SHA256 }}
        sha512: {{ .KATA_CONTAINERS_STATIC_ARM64_SHA512 }}
      - url: https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/{{ .CLOUD_HYPERVISOR_VERSION }}/cloud-hypervisor-static-aarch64
        destination: cloud-hypervisor-static
        sha256: {{ .CLOUD_HYPERVISOR_STATIC_ARM64_SHA256 }}
        sha512: {{ .CLOUD_HYPERVISOR_STATIC_ARM64_SHA512 }}
    # {{ else }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
      - url: https://github.com/kata-containers/kata-containers/releases/download/{{ .KATA_CONTAINERS_VERSION }}/kata-static-{{ .KATA_CONTAINERS_VERSION }}-amd64.tar.zst
        destination: kata-static.tar.zst
        sha256: {{ .KATA_CONTAINERS_STATIC_AMD64_SHA256 }}
        sha512: {{ .KATA_CONTAINERS_STATIC_AMD64_SHA512 }}
      - url: https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/{{ .CLOUD_HYPERVISOR_VERSION }}/cloud-hypervisor-static
        destination: cloud-hypervisor-static
        sha256: {{ .CLOUD_HYPERVISOR_STATIC_AMD64_SHA256 }}
        sha512: {{ .CLOUD_HYPERVISOR_STATIC_AMD64_SHA512 }}
    # {{ end }} This in fact is YAML comment, but Go templating instruction is evaluated by bldr
  - network: default
    prepare:
      - |
        mkdir -p kata-static
        tar xf kata-static.tar.zst -C kata-static
  - network: none
    install:
      - |
        cd kata-static

        mkdir -p /rootfs/usr/local/{bin,libexec,share/kata-containers}

        install -m 0755 ../cloud-hypervisor-static /rootfs/usr/local/bin/cloud-hypervisor
        install -m 0755 ./opt/kata/runtime-rs/bin/containerd-shim-kata-v2 /rootfs/usr/local/bin/containerd-shim-kata-v2
        ln -s containerd-shim-kata-v2 /rootfs/usr/local/bin/containerd-shim-kata-qemu-snp-v2
        cp ./opt/kata/libexec/virtiofsd /rootfs/usr/local/libexec/

        cp ./opt/kata/share/kata-containers/kata-containers.img /rootfs/usr/local/share/kata-containers/kata-containers.img
        cp ./opt/kata/share/kata-containers/vmlinux.container /rootfs/usr/local/share/kata-containers/vmlinux.container
        cp ./opt/kata/share/defaults/kata-containers/runtime-rs/configuration-clh-runtime-rs.toml \
          /rootfs/usr/local/share/kata-containers/configuration.toml

        # Codewire confidential proof parity: install the QEMU-SNP payload
        # and nydus-for-Kata-TEE snapshotter under the Talos extension
        # /usr/local layout. Talos does not ship /bin/sh, so the Kata config
        # must point at a static wrapper that execs the real QEMU binary with
        # its data directory.
        mkdir -p /rootfs/usr/local/{bin,lib,libexec,share/kata-containers,share/ovmf,share/kata-qemu-snp-experimental}
        cp ./opt/kata/bin/qemu-system-x86_64-snp-experimental /rootfs/usr/local/libexec/
        cp -a ./opt/kata/lib/kata-qemu-snp-experimental /rootfs/usr/local/lib/
        cp -a ./opt/kata/share/kata-qemu-snp-experimental/qemu /rootfs/usr/local/share/kata-qemu-snp-experimental/
        GOTOOLCHAIN=local CGO_ENABLED=0 /toolchain/go/bin/go build -trimpath -ldflags='-s -w' \
          -o /rootfs/usr/local/bin/qemu-system-x86_64-snp-experimental \
          /pkg/qemu-snp-wrapper.go
        mkdir -p /rootfs/usr/local/lib/containers/nydus-for-kata-tee
        cp /containerd-nydus-grpc /rootfs/usr/local/lib/containers/nydus-for-kata-tee/
        cp /nydus-overlayfs /rootfs/usr/local/lib/containers/nydus-for-kata-tee/
        cp /nydus-overlayfs /rootfs/usr/local/bin/nydus-overlayfs
        GOTOOLCHAIN=local CGO_ENABLED=0 /toolchain/go/bin/go build -trimpath -ldflags='-s -w' \
          -o /rootfs/usr/local/bin/mount.fuse \
          /pkg/mount-fuse-nydus-wrapper.go
        cp /pkg/config-guest-pulling.toml /rootfs/usr/local/lib/containers/nydus-for-kata-tee/config-guest-pulling.toml
        chmod 0755 /rootfs/usr/local/lib/containers/nydus-for-kata-tee/containerd-nydus-grpc
        chmod 0755 /rootfs/usr/local/lib/containers/nydus-for-kata-tee/nydus-overlayfs
        chmod 0755 /rootfs/usr/local/bin/nydus-overlayfs
        cp ./opt/kata/share/defaults/kata-containers/runtime-rs/configuration-qemu-snp-runtime-rs.toml \
          /rootfs/usr/local/share/kata-containers/configuration-qemu-snp.toml
        cp ./opt/kata/share/ovmf/AMDSEV.fd /rootfs/usr/local/share/ovmf/
        cp ./opt/kata/share/kata-containers/kata-containers-confidential.img /rootfs/usr/local/share/kata-containers/
        cp ./opt/kata/share/kata-containers/kata-containers-initrd-confidential.img /rootfs/usr/local/share/kata-containers/
        cp ./opt/kata/share/kata-containers/root_hash_confidential.txt /rootfs/usr/local/share/kata-containers/
        cp ./opt/kata/share/kata-containers/vmlinuz.container /rootfs/usr/local/share/kata-containers/
        mapfile -t vmlinuz_candidates < <(
          find ./opt/kata/share/kata-containers -maxdepth 1 -type f -name 'vmlinuz-[0-9]*' \
            | grep -E '/vmlinuz-[0-9]+(\.[0-9]+)*-[0-9]+$' \
            | sort
        )
        if [ "${#vmlinuz_candidates[@]}" -ne 1 ]; then
          printf 'expected exactly one versioned vmlinuz, found %s\n' "${#vmlinuz_candidates[@]}" >&2
          exit 1
        fi
        cp "${vmlinuz_candidates[0]}" /rootfs/usr/local/share/kata-containers/

        sed -i \
          -e 's#/opt/kata#/usr/local#g' \
          /rootfs/usr/local/share/kata-containers/configuration.toml
        grep -Eq '^enable_annotations = .*"cc_init_data"' /rootfs/usr/local/share/kata-containers/configuration.toml \
          || sed -i '/^enable_annotations = / s/]$/, "cc_init_data"]/' \
            /rootfs/usr/local/share/kata-containers/configuration.toml

        sed -i \
          -e 's#/opt/kata#/usr/local#g' \
          -e 's#path = "/usr/local/bin/qemu-system-x86_64"#path = "/usr/local/bin/qemu-system-x86_64-snp-experimental"#' \
          -e 's#valid_hypervisor_paths = \["/usr/local/bin/qemu-system-x86_64"\]#valid_hypervisor_paths = ["/usr/local/bin/qemu-system-x86_64-snp-experimental"]#' \
          -e 's#shared_fs = "virtio-fs"#shared_fs = "none"#' \
          -e 's#create_container_timeout = [0-9][0-9]*#create_container_timeout = 180#' \
          /rootfs/usr/local/share/kata-containers/configuration-qemu-snp.toml
        grep -Eq '^enable_annotations = .*"cc_init_data"' /rootfs/usr/local/share/kata-containers/configuration-qemu-snp.toml \
          || sed -i '/^enable_annotations = / s/]$/, "cc_init_data"]/' \
            /rootfs/usr/local/share/kata-containers/configuration-qemu-snp.toml
      - |
        mkdir -p /rootfs/etc/cri/conf.d
        cp /pkg/10-kata-containers.part /rootfs/etc/cri/conf.d/10-kata-containers.part

        mkdir -p /rootfs/usr/local/etc/containers
        cp /pkg/nydus-for-kata-tee.yaml /rootfs/usr/local/etc/containers/nydus-for-kata-tee.yaml

    test:
      - |
        # Codewire renders these two hypervisor annotations for both runtime
        # profiles. Keep the package-level assertion close to the files that
        # containerd loads, rather than relying on an unannotated Kata smoke.
        for config in \
          /rootfs/usr/local/share/kata-containers/configuration.toml \
          /rootfs/usr/local/share/kata-containers/configuration-qemu-snp.toml; do
          annotations="$(sed -nE 's/^enable_annotations = (.*)$/\1/p' "$config")"
          test -n "$annotations"
          printf '%s\n' "$annotations" | grep -Fq '"cc_init_data"'
          printf '%s\n' "$annotations" | grep -Fq '"kernel_params"'
          ! printf '%s\n' "$annotations" | grep -Eq '"(\.\*|\*)"'
        done
        grep -Fqx '[hypervisor.clh]' /rootfs/usr/local/share/kata-containers/configuration.toml
        grep -Eq '^dial_timeout_ms = [1-9][0-9]*$' /rootfs/usr/local/share/kata-containers/configuration.toml
        ! grep -Eq '^dial_timeout[[:space:]]*=' /rootfs/usr/local/share/kata-containers/configuration.toml
        /toolchain/go/bin/go version -m /rootfs/usr/local/bin/qemu-system-x86_64-snp-experimental \
          | grep -Fq ': go1.26.7'
        /toolchain/go/bin/go version -m /rootfs/usr/local/bin/mount.fuse \
          | grep -Fq ': go1.26.7'
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
    sbom:
      outputPath: /rootfs/usr/local/share/spdx/kata-containers.spdx.json
      version: {{ .KATA_CONTAINERS_VERSION }}
      cpes:
        - cpe:2.3:a:katacontainers:kata_containers:{{ .KATA_CONTAINERS_VERSION }}:*:*:*:*:*:*:*
      licenses:
        - Apache-2.0
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
