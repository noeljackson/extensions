name: Build and publish the Codewire confidential-storage extension

on:
  pull_request:
    branches:
      - downstream/confidential-storage
    paths:
      - .github/workflows/downstream-confidential-storage.yml
      - hack/codewire-confidential-storage/**
  push:
    branches:
      - downstream/confidential-storage
    paths:
      - .github/workflows/downstream-confidential-storage.yml
      - hack/codewire-confidential-storage/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out the exact pull-request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install source-only gate tools
        run: |
          sudo ./hack/codewire-confidential-storage/secure-ubuntu-apt-sources /
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Verify the deployment publication contract
        run: ./hack/codewire-confidential-storage/test-publication-contract.sh
      - name: Verify the exact source and builder lock
        run: ./hack/codewire-confidential-storage/build.sh verify
      - name: Verify the non-publishing build plan
        run: ./hack/codewire-confidential-storage/build.sh plan
      - name: Run focused material tests
        run: python3 -m unittest discover -s hack/codewire-confidential-storage/tests -p 'test_*.py'
      - name: Check shell programs
        run: |
          shellcheck \
            hack/codewire-confidential-storage/build.sh \
            hack/codewire-confidential-storage/publish.sh \
            hack/codewire-confidential-storage/qemu-tcg-boot-smoke \
            hack/codewire-confidential-storage/test-qemu-tcg-boot-smoke.sh \
            hack/codewire-confidential-storage/test-publication-contract.sh

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/downstream/confidential-storage' && github.repository == 'noeljackson/extensions'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      OUTPUT_ROOT: _out/confidential-storage
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out the exact deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject an unauthorized publication context
        run: ./hack/codewire-confidential-storage/publish.sh preflight
      - name: Install exact-build and boot-gate tools
        run: |
          sudo ./hack/codewire-confidential-storage/secure-ubuntu-apt-sources /
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils e2fsprogs fdisk jq make qemu-system-x86 skopeo zstd
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Record runner capacity
        run: |
          nproc
          free -h
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
      - name: Build the exact Kata closure
        env:
          CODEWIRE_CONFIDENTIAL_STORAGE_SCRATCH_ROOT: ${{ runner.temp }}/codewire-confidential-storage-scratch
        run: |
          mkdir -p "${CODEWIRE_CONFIDENTIAL_STORAGE_SCRATCH_ROOT}" "${OUTPUT_ROOT}"
          ./hack/codewire-confidential-storage/build.sh \
            kata-static "${OUTPUT_ROOT}/kata-static.tar.zst"
      - name: Build the attested Talos extension OCI archive
        env:
          CODEWIRE_CONFIDENTIAL_STORAGE_SCRATCH_ROOT: ${{ runner.temp }}/codewire-confidential-storage-scratch
        run: |
          ./hack/codewire-confidential-storage/build.sh \
            kata-extension \
            "${OUTPUT_ROOT}/kata-static.tar.zst" \
            "${OUTPUT_ROOT}/kata-extension"
      - name: Boot the exact final archive under QEMU TCG
        run: |
          ./hack/codewire-confidential-storage/qemu-tcg-boot-smoke \
            "${OUTPUT_ROOT}/kata-extension/kata-extension.oci.tar"
      - name: Bind the verified publication payload
        run: |
          test -s "${OUTPUT_ROOT}/kata-extension/kata-extension.metadata.json"
          test -n "$(find "${OUTPUT_ROOT}/kata-extension/materials" -type f -print -quit)"
          (
            cd "${OUTPUT_ROOT}/kata-extension"
            find kata-extension.oci.tar kata-extension.metadata.json materials \
              -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              >publication-payload.sha256
          )
      - name: Preserve the verified publication payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidential-storage-payload-${{ github.sha }}
          path: |
            _out/confidential-storage/kata-extension/kata-extension.oci.tar
            _out/confidential-storage/kata-extension/kata-extension.metadata.json
            _out/confidential-storage/kata-extension/materials/
            _out/confidential-storage/kata-extension/publication-payload.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/downstream/confidential-storage' && github.repository == 'noeljackson/extensions'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      OUTPUT_ROOT: _out/confidential-storage
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out the exact deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject an unauthorized publication context
        run: ./hack/codewire-confidential-storage/publish.sh preflight
      - name: Download the verified publication payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidential-storage-payload-${{ github.sha }}
          path: ${{ env.OUTPUT_ROOT }}/kata-extension
      - name: Verify the publication payload binding
        run: |
          (
            cd "${OUTPUT_ROOT}/kata-extension"
            sha256sum --check publication-payload.sha256
          )
      - name: Install publication tools
        run: |
          sudo ./hack/codewire-confidential-storage/secure-ubuntu-apt-sources /
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq skopeo
      - name: Log in to GHCR for the immutable copy
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the immutable OCI index
        id: publication
        run: |
          ./hack/codewire-confidential-storage/publish.sh publish \
            "${OUTPUT_ROOT}/kata-extension/kata-extension.oci.tar" \
            "${OUTPUT_ROOT}/publication.json"
      - name: Add deployment-commit provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publication.outputs.image }}
          subject-digest: ${{ steps.publication.outputs.digest }}
          push-to-registry: true
      - name: Preserve non-secret publication receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidential-storage-publication-${{ github.sha }}
          path: |
            _out/confidential-storage/publication.json
            _out/confidential-storage/kata-extension/kata-extension.metadata.json
            _out/confidential-storage/kata-extension/materials/
            _out/confidential-storage/kata-extension/publication-payload.sha256
          if-no-files-found: error
          retention-days: 90
